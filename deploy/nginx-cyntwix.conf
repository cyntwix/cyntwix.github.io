map $request_method $cyntwix_submission_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $cyntwix_submission_key zone=cyntwix_submissions:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name siismets.com www.siismets.com cyntwix.local;

    root /srv/cyntwix;
    index index.html;

    location = /api/entries {
        client_max_body_size 16k;
        limit_req zone=cyntwix_submissions burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:db|sqlite|py|service|conf|md)$ {
        deny all;
    }
}
