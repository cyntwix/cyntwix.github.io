<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contact</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="plate.css">
    <style>
      .colophon {
        top: 56px; bottom: auto; left: 16px; right: auto;
        width: min(380px, calc(100vw - 32px));
        text-align: left;
        pointer-events: auto;
      }
      .colophon.dim { opacity: 1; }
      .colophon h1 { font-size: 32px; }
      .colophon .subhead { font-size: 14px; line-height: 1.45; margin-top: 6px; color: #d9c690; text-shadow: 0 0 2px #000, 1px 1px 0 #000; }
      .email-link {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 14px;
        border: 3px outset #9a762e;
        background: #321006;
        color: #f4cf68 !important;
        font: bold 15px "Courier New", Courier, monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
      }
      .email-link:hover { background: #421500; color: #fff1a3 !important; }
      .email-link:active, .email-link.sending { border-style: inset; background: #6a2a08; }
      .pin[data-grave] em { font-size: 14px; }
      .fallback-only { max-width: 520px; margin: 30px auto; padding: 0 16px; text-align: center; }
      .fallback-only img { max-width: 100%; }
      body.no-gl .colophon { position: static; margin: 90px auto 0; }
    </style>
  </head>
  <body class="scene-locked">
    <header class="site-header" aria-label="Site navigation">
      <a class="sigil" href="index.html" aria-label="Cyntwix home">AS</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="videos.html">Videos</a>
        <a href="writing.html">Words</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>

    <canvas id="plate" aria-label="A night plain strung with telegraph wire, every line running to a tall mast. At its foot is a grave marked E-MAIL."></canvas>

    <div class="pin" data-grave><em>the mailbox watches back</em></div>
    <div class="omen" aria-hidden="true"></div>

    <section class="colophon" aria-labelledby="contact-title">
      <p class="kicker">open wire / open channel</p>
      <h1 id="contact-title">Contact</h1>
      <p class="subhead">questions, comments, concerns, and curse words may be sent through the usual wire.</p>
      <a class="email-link" href="#" id="transmissionLink">SEND A TRANSMISSION</a>
    </section>

    <div class="fallback-only">
      <img src="assets/email.gif" alt="Email transmission animation">
      <p class="subhead">the mailbox watches back</p>
    </div>

    <span class="hint">the grave answers too.</span>
    <button class="hum" type="button" aria-pressed="false">hum: off</button>

    <script src="three.js"></script>
    <script src="assets.js"></script>
    <script src="plate.js"></script>
    <script src="scene-contact.js"></script>
    <script>
      // without WebGL the scene script never wires the link, so do it plainly
      if (document.body.classList.contains('no-gl')) {
        document.getElementById('transmissionLink').addEventListener('click', function (e) {
          e.preventDefault();
          var a = [97, 100, 97, 109, 115, 105, 105, 115, 109, 101, 116, 115, 64, 103, 109, 97, 105, 108, 46, 99, 111, 109];
          window.location.href = 'mailto:' + a.map(function (c) { return String.fromCharCode(c); }).join('');
        });
      }
    </script>
  </body>
</html>
