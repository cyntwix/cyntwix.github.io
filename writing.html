<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Words</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="pre2010.css">
  </head>
  <body>
    <header class="writing-header">
      <a class="sigil" href="index.html" aria-label="Cyntwix home">AS</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="videos.html">Videos</a>
        <a href="writing.html">Words</a>
        <a href="entries.html">Entries</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="generator" aria-labelledby="page-title">
        <p class="kicker">writing sketch instrument</p>
        <h1 id="page-title">Submit Your Creation</h1>
        <p class="subtitle">Select an amount</p>

        <div class="count-options" role="group" aria-label="Number of words to grab">
          <button class="count-option" type="button" data-count="3">3</button>
          <button class="count-option is-selected" type="button" data-count="5">5</button>
          <button class="count-option" type="button" data-count="7">7</button>
          <button class="count-option" type="button" data-count="10">10</button>
        </div>

        <button class="go-button" type="button">Begin</button>

        <section class="selected-section" aria-live="polite">
          <h2>Your words to use:</h2>
          <div class="word-list" id="word-list"></div>
        </section>

        <label class="name-field">
          <span>Your name</span>
          <input id="name-box" type="text" autocomplete="name" maxlength="80">
        </label>

        <textarea id="writing-box" spellcheck="true" aria-label="Writing area"></textarea>

        <p class="word-counter"><span id="word-count">0</span> words</p>
        <button class="submit-button" type="button" disabled>Enter a name to submit</button>
        <a class="entries-link" href="entries.html">View entries</a>
        <p class="status" id="status" role="status"></p>
      </section>
    </main>

    <footer>
      <span></span>
      <img src="eye.gif" alt="">
      <p>WORDS / 2026</p>
      <img src="eye2.gif" alt="">
      <span></span>
    </footer>

    <script src="submission-config.js"></script>
    <script src="data/words-data.js"></script>
    <script src="writing-generator.js"></script>
  </body>
</html>
