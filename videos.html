<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Video Archive</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="plate.css">
    <style>
      .colophon { top: 54px; bottom: auto; left: auto; right: 16px; text-align: right; }
      .colophon h1 { font-size: 26px; }
      .hover-panel {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        max-width: min(680px, 92vw);
        padding: 3px 10px;
        border: 2px ridge #9a762e;
        background: rgba(12, 7, 1, 0.82);
        font: 15px "Courier New", Courier, monospace;
        color: #f4cf68;
        text-align: center;
        pointer-events: none;
      }
      .well-tools {
        position: fixed;
        left: 10px; top: 52px;
        z-index: 6;
        font: 13px "Courier New", Courier, monospace;
        color: #8a6a35;
      }
      .well-tools button {
        padding: 0;
        border: 0;
        background: none;
        color: #e0b643;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .well-tools button:hover { color: #fff1a3; background: #421500; }
      .back {
        position: fixed;
        left: 10px; bottom: 8px;
        z-index: 21;
        font: 13px "Courier New", Courier, monospace;
      }
      .hint { left: 50%; transform: translateX(-50%); }
      @media (max-width: 600px) {
        .hover-panel { bottom: 54px; font-size: 13px; }
        .well-tools { top: auto; bottom: 30px; }
        .hint { transform: none; top: 84px; }
      }

      #frame-list {
        position: fixed;
        z-index: 25;
        top: 80px; left: 10px;
        width: min(420px, calc(100vw - 20px));
        max-height: calc(100vh - 130px);
        overflow: auto;
      }
      #frame-list ol { margin: 8px 0 0; padding-left: 30px; font: 13px "Courier New", Courier, monospace; color: #b57b2a; }
      #frame-list li { margin: 3px 0; }
      #frame-list li button {
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 1px 2px;
        color: #e0b643;
        text-decoration: underline;
      }
      #frame-list li button:hover { background: #421500; color: #fff1a3; }

      /* pinned over the picture of the tapestry that came off the wall */
      #player {
        position: fixed;
        z-index: 30;
        box-sizing: border-box;
        background: #000;
        outline: 3px ridge #c9953e;
        box-shadow: 0 0 0 7px rgba(20, 8, 2, 0.85), 12px 14px 0 7px rgba(0, 0, 0, 0.5);
      }
      #player[hidden], #frame-list[hidden] { display: none; }
      .player-slot { position: absolute; inset: 0; }
      .player-slot iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .player-bar {
        position: absolute;
        left: -7px; right: -7px; top: calc(100% + 10px);
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
        padding: 5px 8px;
        border: 2px ridge #9a762e;
        background: rgba(12, 7, 1, 0.9);
        font: 13px "Courier New", Courier, monospace;
      }
      .player-title { flex: 1 1 auto; color: #f4cf68; font: bold 16px "Times New Roman", Times, serif; letter-spacing: 0.04em; }
      .player-close {
        padding: 0; border: 0; background: none;
        color: #e0b643; font: inherit; text-decoration: underline; cursor: pointer;
      }
      .player-close:hover { color: #fff1a3; background: #421500; }
      .player-out { font-size: 12px; }
      .hover-panel[hidden] { display: none; }

      body.no-gl #frame-list { position: static; display: block !important; margin: 100px auto 40px; }
      body.no-gl .hover-panel, body.no-gl .well-tools, body.no-gl .colophon { display: none; }
    </style>
  </head>
  <body class="scene-locked">
    <header class="site-header" aria-label="Site navigation">
      <a class="sigil" href="index.html" aria-label="Cyntwix home">AS</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="videos.html" aria-current="page">Videos</a>
        <a href="writing.html">Words</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <canvas id="plate" aria-label="The end wall of a cathedral hung with tapestries, one for each video. Click a tapestry to play it."></canvas>

    <div class="hover-panel" id="hover-title" aria-live="polite">Hover a frame</div>
    <div class="well-tools">
      <button type="button" id="list-toggle">index of frames</button>
          </div>

    <div class="panel" id="frame-list" hidden>
      <h2>Videos</h2>
      <ol></ol>
    </div>

    <div id="player" hidden role="dialog" aria-label="Video player">
      <div class="player-slot"></div>
      <div class="player-bar">
        <span class="player-title"></span>
        <button type="button" class="player-close">back on the wall</button>
        <a class="player-out" href="#" target="_blank" rel="noopener">won't play? watch it on youtube</a>
      </div>
    </div>

    <div class="omen" aria-hidden="true"></div>

    <section class="colophon">
      <p class="kicker">moving images</p>
      <h1>Videos</h1>
    </section>

    <a class="back" href="index.html" data-plate-link>RETURN TO THE CORE</a>
    <span class="hint">click a tapestry to play it.</span>
    <button class="hum" type="button" aria-pressed="false">hum: off</button>

    <script src="three.js"></script>
    <script src="assets.js"></script>
    <script src="plate.js"></script>
    <script src="scene-videos.js"></script>
  </body>
</html>
